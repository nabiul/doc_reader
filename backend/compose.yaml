services:
  office-converter:
    build: .
    ports:
      - "8787:8787"
    environment:
      MAX_FILE_BYTES: "52428800"
      CONVERSION_TIMEOUT_SECONDS: "120"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
